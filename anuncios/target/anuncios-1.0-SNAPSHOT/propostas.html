<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <title>Gestão de propostas</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/styleProposta.css">

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light navbar-flutuante">

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menu">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="agentes.html">Agentes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="clientes.html">Clientes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="imovel.html">Imóveis</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="propostas.html">Propostas</a>
                </li>
                <li class="nav-item" id="navAuth"><a class="nav-link" href="login.html">Entrar</a></li>

            </ul>
        </div>
    </nav>

    <main class="container propostas-container">

        <h1>Gestão de Propostas</h1>

        <form id="propostaForm">

            <div class="form-row">

                <div class="form-group col-md-6">
                    <label for="clienteId">Cliente</label>
                    <select id="clienteId" class="form-control" required>
                        <option value="">Selecionar cliente</option>
                    </select>
                </div>

                <div class="form-group col-md-6">
                    <label for="imovelId">Imóvel</label>
                    <select id="imovelId" class="form-control" required>
                        <option value="">Selecionar imóvel</option>
                    </select>
                </div>

                <div class="form-group col-md-12">
                    <label for="preco">Preço proposto (€)</label>
                    <input type="number" id="preco" class="form-control" placeholder="Preço" min="1" required>
                </div>

                <div class="form-group col-md-12">
                    <label for="comentario">Comentário</label>
                    <textarea id="comentario" class="form-control" rows="3" placeholder="Comentário" required></textarea>
                </div>

            </div>

            <div class="form-actions">
                <button type="reset" class="btn btn-danger">Limpar</button>
                <button type="submit" class="btn btn-primary">Adicionar proposta</button>
            </div>

        </form>

        <div id="mensagem"></div>

        <div id="listaPropostas"></div>

    </main>

</body>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>

<script src="js/scriptproposta.js"></script>

<script src="js/auth.js"></script>
</html>
