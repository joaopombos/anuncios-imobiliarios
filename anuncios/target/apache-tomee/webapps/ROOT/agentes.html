<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestão de Agentes Imobiliários</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light navbar-flutuante">

        <button class="navbar-toggler" type="button"
            data-toggle="collapse"
            data-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Abrir menu">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-center"
            id="navbarNav">

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item active">
                    <a class="nav-link" href="agentes.html">
                        Agentes
                        <span class="sr-only">(atual)</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="clientes.html">
                        Clientes
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="imovel.html">
                        Imóveis
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="propostas.html">
                        Propostas
                    </a>
                </li>
                <li class="nav-item" id="navAuth"><a class="nav-link" href="login.html">Entrar</a></li>

            </ul>
        </div>
    </nav>

    <main class="container agentes-container">

        <h1>Gestão de Agentes Imobiliários</h1>

        <form id="agenteForm">

            <div class="form-row">

                <div class="form-group col-md-7">
                    <label for="nome">Nome do agente</label>
                    <input type="text"
                        id="nome"
                        class="form-control"
                        placeholder="Nome do agente"
                        disabled>
                </div>

                <div class="form-group col-md-5">
                    <label for="contacto">Contacto</label>
                    <input type="tel"
                        id="contacto"
                        class="form-control"
                        placeholder="Contacto"
                        disabled>
                </div>

            </div>

            <div class="form-actions">
                <button type="reset" class="btn btn-danger" disabled>
                    Limpar
                </button>

                <button type="submit" class="btn btn-primary" disabled>
                    Adicionar agente
                </button>
            </div>

        </form>

        <div id="mensagem"></div>

        <div id="listaAgentes"></div>

    </main>

    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>

    <script src="js/scriptagentes.js"></script>

</body>

<script src="js/auth.js"></script>
</html>
